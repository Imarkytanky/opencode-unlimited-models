# supervisord.conf — process manager for the containerized stack
# Runs both daemons (opencode-egress-router + zen-unlimited gateway) in one container.
# Each daemon auto-restarts on crash.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:opencode-egress-router]
command=/app/opencode-proxy/opencode-egress-router -listen 0.0.0.0:8318 -upstream https://opencode.ai/zen/v1 -ovh-proxy "" -cooldown 60s
directory=/app/opencode-proxy
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/oc-proxy.log
stderr_logfile=/var/log/supervisor/oc-proxy.err
environment=HOME="/root"

[program:zen-relay]
command=node /app/zen-unlimited-linux/src/relay/rr-socks.mjs
directory=/app/zen-unlimited-linux
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/supervisor/zen-relay.log
stderr_logfile=/var/log/supervisor/zen-relay.err
environment=HOME="/root"

[program:zen-gateway]
command=bun run /app/zen-unlimited-linux/src/index.ts serve --no-egress-direct
directory=/app/zen-unlimited-linux
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/zen-gateway.log
stderr_logfile=/var/log/supervisor/zen-gateway.err
environment=HOME="/root"
